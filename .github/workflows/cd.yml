# ============================================================
# CD PIPELINE — Continuous Deployment for ecom-microservices
# ============================================================
#   push to main    →  build images  →  deploy to STAGING
#   push tag v*.*.* →  build images  →  deploy to PRODUCTION
#
#   ┌──────┐   ┌────────┐   ┌────────┐   ┌───────┐   ┌─────────┐
#   │ Plan │──▶│ Images │──▶│ Deploy │──▶│ Smoke │──▶│ Report  │
#   └──────┘   │ (×4)   │   └────────┘   └───────┘   └─────────┘
#              └────────┘
#
# Required secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  Docker Hub account name
#   DOCKERHUB_TOKEN     Docker Hub access token, not the account password
#   KUBE_CONFIG         base64-encoded kubeconfig for the target cluster
#
# Optional:
#   SLACK_WEBHOOK_URL   Incoming webhook; the notify job is skipped without it
# ============================================================

name: CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

  # Manual trigger, for redeploying or rolling back without a new commit.
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Image tag to deploy (blank uses `latest`)
        required: false
        default: ''

# One deploy per ref at a time. Unlike CI, in-progress runs are NOT cancelled:
# interrupting a half-finished rollout would leave the cluster in a mixed state.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/ecom

jobs:
  # ==========================================================================
  # STAGE 1 — Plan
  # ==========================================================================
  # Resolves which environment is being targeted and what the images should be
  # tagged with, so every downstream job reads one authoritative answer instead
  # of re-deriving it from the git ref.
  # ==========================================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      namespace: ${{ steps.resolve.outputs.namespace }}

    steps:
      - name: Resolve environment and image tag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
            TAG="${{ github.event.inputs.image_tag }}"
            TAG="${TAG:-latest}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # A semantic version tag is the production release signal.
            ENV_NAME="production"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Any other push to main goes to staging, tagged with the commit so
            # a running pod can always be traced back to its source.
            ENV_NAME="staging"
            TAG="${GITHUB_SHA:0:7}"
          fi

          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "namespace=ecom-$ENV_NAME" >> "$GITHUB_OUTPUT"

      - name: Render deployment plan
        run: |
          {
            echo "## Deployment plan"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`${{ steps.resolve.outputs.env_name }}\` |"
            echo "| Namespace | \`${{ steps.resolve.outputs.namespace }}\` |"
            echo "| Image tag | \`${{ steps.resolve.outputs.image_tag }}\` |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` on \`${GITHUB_REF_NAME}\` |"
            echo "| Actor | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # STAGE 2 — Build and push images
  # ==========================================================================
  # One matrix leg per service, so all four build in parallel and the graph
  # names whichever one fails.
  #
  # Note the build context is the repository ROOT for every service: this is an
  # npm-workspaces monorepo, and each service needs the root manifest plus
  # packages/ to compile. Pointing the context at the service directory (as an
  # earlier revision did) cannot work — the Dockerfiles would not find them.
  # ==========================================================================
  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: plan

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/gateway/Dockerfile
          - service: auth-service
            dockerfile: services/auth-service/Dockerfile
          - service: product-service
            dockerfile: services/product-service/Dockerfile
          - service: order-service
            dockerfile: services/order-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enables building the arm64 image on an x86 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.plan.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Cache scoped per service so one service's layers never evict another's.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Report pushed image
        run: |
          {
            echo "## Image — ${{ matrix.service }}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| Tags | \`${{ needs.plan.outputs.image_tag }}\`, \`latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # STAGE 3 — Deploy
  # ==========================================================================
  # Rolling update of all four Deployments, then a blocking wait on each
  # rollout. Gated behind a GitHub Environment so production can require a
  # manual approval (Settings → Environments).
  # ==========================================================================
  deploy:
    name: Deploy to ${{ needs.plan.outputs.env_name }}
    runs-on: ubuntu-latest
    needs:
      - plan
      - images
    environment: ${{ needs.plan.outputs.env_name }}

    env:
      NAMESPACE: ${{ needs.plan.outputs.namespace }}
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          # A kubeconfig is a credential — kubectl refuses group/world-readable files.
          chmod 600 "$HOME/.kube/config"

      - name: Roll out new images
        run: |
          # Deployment name and container name match the service name in every
          # manifest, which is what lets this be a loop rather than four steps.
          for SVC in api-gateway auth-service product-service order-service; do
            IMAGE="${REGISTRY}/${IMAGE_PREFIX}-${SVC}:${IMAGE_TAG}"
            echo "Setting $SVC to $IMAGE"
            kubectl set image "deployment/$SVC" "$SVC=$IMAGE" -n "$NAMESPACE"
          done

      - name: Wait for rollouts
        run: |
          for SVC in api-gateway auth-service product-service order-service; do
            echo "Waiting for $SVC..."
            kubectl rollout status "deployment/$SVC" -n "$NAMESPACE" --timeout=5m
          done

      - name: Report rollout state
        if: always()
        run: |
          {
            echo "## Rollout — ${{ needs.plan.outputs.env_name }}"
            echo
            echo '```'
            kubectl get deployments -n "$NAMESPACE" -o wide 2>&1 || echo "Could not reach the cluster."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # STAGE 4 — Smoke test
  # ==========================================================================
  # A rollout completing only proves the pods started, not that the stack is
  # actually serving. This probes the gateway's /health endpoint, which reports
  # its own status plus every upstream it depends on.
  # ==========================================================================
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs:
      - plan
      - deploy

    env:
      NAMESPACE: ${{ needs.plan.outputs.namespace }}

    steps:
      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Probe the gateway health endpoint
        id: probe
        run: |
          # Port-forward rather than requiring a public ingress, so this works
          # the same way against a private staging cluster.
          kubectl port-forward "service/api-gateway" 18080:8080 -n "$NAMESPACE" &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          # Give the tunnel a moment, then retry — a pod can pass its readiness
          # probe a beat before it is actually accepting connections.
          for ATTEMPT in 1 2 3 4 5; do
            sleep 3
            if BODY=$(curl -fsS --max-time 10 http://127.0.0.1:18080/health); then
              echo "Gateway healthy on attempt $ATTEMPT"
              echo "$BODY" > /tmp/health.json
              exit 0
            fi
            echo "Attempt $ATTEMPT failed, retrying..."
          done

          echo "Gateway did not become healthy after 5 attempts."
          exit 1

      - name: Report health
        if: always()
        run: |
          {
            echo "## Smoke test"
            echo
            if [[ -f /tmp/health.json ]]; then
              echo "The gateway reported healthy, including all upstreams:"
              echo
              echo '```json'
              jq . /tmp/health.json 2>/dev/null || cat /tmp/health.json
              echo '```'
            else
              echo "The gateway did not return a healthy response. The rollout"
              echo "completed but the stack is not serving — consider rolling back:"
              echo
              echo '```bash'
              echo "kubectl rollout undo deployment/api-gateway -n ${NAMESPACE}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # STAGE 5 — Report
  # ==========================================================================
  # Closes the graph. Always runs, so a failed deploy is reported just as
  # loudly as a successful one.
  # ==========================================================================
  report:
    name: Report
    runs-on: ubuntu-latest
    if: always()
    needs:
      - plan
      - images
      - deploy
      - smoke

    # Lifted to job level because the `secrets` context is not available in a
    # step-level `if:` — the Slack step tests `env.SLACK_WEBHOOK_URL` instead.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Render deployment dashboard
        env:
          R_IMAGES: ${{ needs.images.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
          R_SMOKE: ${{ needs.smoke.result }}
          ENV_NAME: ${{ needs.plan.outputs.env_name }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
        run: |
          icon() {
            case "$1" in
              success)   echo ':white_check_mark: passed' ;;
              failure)   echo ':x: failed' ;;
              cancelled) echo ':black_circle: cancelled' ;;
              skipped)   echo ':fast_forward: skipped' ;;
              *)         echo ":grey_question: $1" ;;
            esac
          }

          {
            echo "# CD Pipeline — ${ENV_NAME}"
            echo
            echo "Deployed tag \`${IMAGE_TAG}\`"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Build images (4) | $(icon "$R_IMAGES") |"
            echo "| Deploy | $(icon "$R_DEPLOY") |"
            echo "| Smoke test | $(icon "$R_SMOKE") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Slack notification
        # Skipped automatically when the webhook secret is not configured.
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          ENV_NAME: ${{ needs.plan.outputs.env_name }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
        run: |
          if [[ "$DEPLOY_RESULT" == "success" && "$SMOKE_RESULT" == "success" ]]; then
            COLOR="#36a64f"
            HEADLINE=":white_check_mark: Deploy to *${ENV_NAME}* succeeded"
          else
            COLOR="#e01e5a"
            HEADLINE=":x: Deploy to *${ENV_NAME}* FAILED (deploy: ${DEPLOY_RESULT}, smoke: ${SMOKE_RESULT})"
          fi

          # jq builds the payload so branch names and commit subjects containing
          # quotes cannot break out of the JSON.
          PAYLOAD=$(jq -n \
            --arg color "$COLOR" \
            --arg headline "$HEADLINE" \
            --arg tag "$IMAGE_TAG" \
            --arg actor "${{ github.actor }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              attachments: [{
                color: $color,
                blocks: [
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: ($headline + "\n*Tag:* `" + $tag + "`  |  *Actor:* @" + $actor)
                    }
                  },
                  {
                    type: "actions",
                    elements: [{
                      type: "button",
                      text: { type: "plain_text", text: "View run" },
                      url: $url
                    }]
                  }
                ]
              }]
            }')

          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
